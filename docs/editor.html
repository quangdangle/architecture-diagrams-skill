  var section = H('section', { class: 'diagram-section is-hidden', id: 'section-' + d.id, role: states.length > 1 ? 'tabpanel' : null });
  var showTitle = d.title && d.title !== spec.title;
  if (showTitle || d.tag) {
    section.appendChild(H('div', { class: 'd-head' }, [
      showTitle ? H('h2', { text: d.title }) : null,
      d.tag ? H('span', { class: 'd-tag', text: d.tag }) : null
    ]));
  }
  if (d.summary) {
    var sum = H('div', { class: 'summary' }, [H('span', { class: 'badge', text: t('readFirst') })]);
    richText(sum, d.summary);
    section.appendChild(sum);
  }
  var isGraph = d.kind === 'graph';
  var ws = H('div', { class: 'workspace' + (isGraph && d.steps.length ? (st.L.width > 1000 ? ' stack' : '') : ' no-steps') });
  var board = H('div', { class: 'board' });
  var bZoomOut = H('button', { type: 'button', class: 'tb-btn', title: t('zoomOut'), 'aria-label': t('zoomOut'), text: '−' });
  var bFit = H('button', { type: 'button', class: 'tb-btn', title: t('fitTitle'), text: t('fit') });
  var bZoomIn = H('button', { type: 'button', class: 'tb-btn', title: t('zoomIn'), 'aria-label': t('zoomIn'), text: '+' });
  var bMenu = H('button', { type: 'button', class: 'tb-btn', 'aria-haspopup': 'true', 'aria-expanded': 'false', text: '↓ ' + t('download') });
  var menu = H('div', { class: 'menu', role: 'menu' });
  menu.hidden = true;
  var formats = [['copy', t('fmtCopy')], ['svg', t('fmtSvg')], ['png', t('fmtPng')], ['drawio', t('fmtDrawio')]];
  if (isGraph) formats.push(['mermaid', t('fmtMermaid')]);
  if (d.kind === 'register' || d.kind === 'memory' || d.kind === 'pinout') formats.push(['csv', t('fmtCsv')]);
  formats.forEach(function (f) {
    var item = H('button', { type: 'button', role: 'menuitem', 'data-format': f[0], text: f[1] });
    item.addEventListener('click', function () { menu.hidden = true; bMenu.setAttribute('aria-expanded', 'false'); if (f[0] === 'copy') copyPng(st, bMenu); else exportAs(st, f[0]); });
    menu.appendChild(item);
  });
  bMenu.addEventListener('click', function (ev) {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    bMenu.setAttribute('aria-expanded', menu.hidden ? 'false' : 'true');
  });
  document.addEventListener('click', function (ev) { if (!menu.hidden && !menu.contains(ev.target)) { menu.hidden = true; bMenu.setAttribute('aria-expanded', 'false'); } });
  var hint = { wave: t('hintWave'), register: t('hintReg'), memory: t('hintMem'), chip: t('hintChip'), pinout: t('hintPin') }[d.kind] || t('hint');
  var tools = [H('span', { class: 'hint', text: hint })];
  if (isGraph) {
    st.searchEl = H('input', { type: 'search', class: 'tb-search', placeholder: t('search') + '…', title: t('searchTitle'), 'aria-label': t('searchTitle') });
    st.countEl = H('span', { class: 'tb-count', 'aria-live': 'polite' });
    tools.push(st.searchEl, st.countEl);
  }
  if (isGraph) {
    var bGrid = H('button', { type: 'button', class: 'tb-btn tb-grid', title: t('gridTitle'), 'aria-label': t('gridTitle'), 'aria-pressed': 'false', text: '▦' });
    bGrid.addEventListener('click', function () { toggleGrid(); });
    tools.push(bGrid);
  }
  st.zoomEl = H('span', { class: 'tb-zoom', 'aria-live': 'polite', title: t('zoomLevel') });
  tools.push(bZoomOut, st.zoomEl, bFit, bZoomIn, H('span', { class: 'tb-sep' }), H('div', { class: 'tb-menu' }, [bMenu, menu]));
  board.appendChild(H('div', { class: 'toolbar' }, tools));
  if (isGraph) st.searchEl.addEventListener('input', function () { runSearch(st, st.searchEl.value); });
  if (isGraph) st.searchEl.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (st.matches && st.matches.length) {
        st.matchIndex = (st.matchIndex + 1) % st.matches.length;
        selectNode(st, st.matches[st.matchIndex], true);
      }
    } else if (ev.key === 'Escape') {
      st.searchEl.value = '';
      runSearch(st, '');
      st.searchEl.blur();
    }
  });
  st.detailsEl = H('div', { class: 'details', role: 'region', 'aria-live': 'polite' });
  st.detailsEl.hidden = true;
  board.appendChild(st.detailsEl);
  st.canvas = H('div', { class: 'canvas' });
  board.appendChild(st.canvas);
  st.board = board;
  st.legendEl = H('div', { class: 'legend' });
  board.appendChild(st.legendEl);
  ws.appendChild(board);

  bZoomOut.addEventListener('click', function () { zoomBy(st, 0.8); });
  bZoomIn.addEventListener('click', function () { zoomBy(st, 1.25); });
  bFit.addEventListener('click', function () { st.scale = null; st.userFit = true; applyZoom(st); });

  st.stepItems = [];
  if (d.steps.length) {
    var prev = H('button', { type: 'button', class: 'tb-btn', title: t('prev'), 'aria-label': t('prev'), text: '‹' });
    st.playBtn = H('button', { type: 'button', class: 'tb-btn', title: t('play'), 'aria-label': t('play'), text: '▶' });
    var next = H('button', { type: 'button', class: 'tb-btn', title: t('next'), 'aria-label': t('next'), text: '›' });
    prev.addEventListener('click', function () { stopPlay(st); setStep(st, st.stepIndex < 0 ? 0 : st.stepIndex - 1); });
    next.addEventListener('click', function () { stopPlay(st); setStep(st, st.stepIndex + 1); });
    st.playBtn.addEventListener('click', function () { togglePlay(st); });
    var ol = H('ol');
    d.steps.forEach(function (step, k) {
      var li = H('li', { class: 'step', tabindex: 0, 'aria-current': 'false' }, [
        H('span', { class: 'num', text: String(k + 1) }),
        H('div', {}, [H('div', { class: 'st-title', text: step.title }), step.text ? richText(H('div', { class: 'st-text' }), step.text) : null])
      ]);
      li.addEventListener('click', function () { stopPlay(st); setStep(st, k); });
      li.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); stopPlay(st); setStep(st, k); } });
      ol.appendChild(li);
      st.stepItems.push(li);
    });
    ws.appendChild(H('aside', { class: 'steps' }, [
      H('div', { class: 'steps-head' }, [H('strong', { text: t('steps') }), H('div', { class: 'steps-nav' }, [prev, st.playBtn, next])]),
      ol
    ]));
  }
  section.appendChild(ws);
  if (d.kind === 'register' || d.kind === 'memory' || d.kind === 'pinout') section.appendChild(buildTables(st));
  document.getElementById('sections').appendChild(section);
  st.section = section;
}

function renderState(st) {
  var drawn = drawAny(st, false);
  st.svg = drawn.svg;

  st.nodeEls = drawn.refs.nodeEls;
  st.edgeEls = drawn.refs.edgeEls;
  st.labelEls = drawn.refs.labelEls;
  st.canvas.textContent = '';
  st.canvas.appendChild(st.svg);
  buildMinimap(st);
  applyZoom(st);
  buildLegend(st);
  if (st.d.kind !== 'graph') return;
  applyFocus(st);
  applySearch(st);
  st.svg.addEventListener('click', function (ev) {
    var nodeEl = ev.target.closest ? ev.target.closest('.node') : null;
    stopPlay(st);
    resetSteps(st);
    if (!nodeEl) { st.focus = null; applyFocus(st); hideDetails(st); return; }
    var id = nodeEl.getAttribute('data-id');
    if (st.focus && st.focus.type === 'node' && st.focus.id === id) { st.focus = null; applyFocus(st); hideDetails(st); return; }
    st.focus = { type: 'node', id: id };
    applyFocus(st);
    showDetails(st, id);
  });
  st.svg.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var nodeEl = ev.target.closest ? ev.target.closest('.node') : null;
    if (!nodeEl) return;
    ev.preventDefault();
    nodeEl.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  });
}

function showSection(index, updateHash) {
  states.forEach(function (st, i) {
    st.section.classList.toggle('is-hidden', i !== index);
    if (st.tab) st.tab.setAttribute('aria-selected', i === index ? 'true' : 'false');
    if (i !== index) stopPlay(st);
  });
  active = states[index];
  if (active && active.svg && active.scale === null) applyZoom(active);
  if (updateHash && states.length > 1 && history.replaceState) history.replaceState(null, '', '#' + active.d.id);
}

function buildTabs() {
  var nav = document.getElementById('tabs');
  if (states.length < 2) return;
  nav.hidden = false;
  states.forEach(function (st, i) {
    var b = H('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': 'false', 'aria-controls': 'section-' + st.d.id, text: st.d.title || st.d.id });
    b.addEventListener('click', function () { showSection(i, true); if (typeof edFollowTab === 'function') edFollowTab(st.d.id); });
    nav.appendChild(b);
    st.tab = b;
  });
}

/* ---------- theme ---------- */
function storageGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function storageSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
function setTheme(name, remember) {
  themeName = name === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', themeName);
  var btn = document.getElementById('theme-btn');
  btn.hidden = false;
  btn.textContent = themeName === 'dark' ? '☀' : '☾';
  btn.title = themeName === 'dark' ? t('toLight') : t('toDark');
  btn.setAttribute('aria-label', btn.title);
  if (remember) storageSet('architecture-diagrams-theme', themeName);
  states.forEach(renderState);
}
function initialTheme() {
  var q = new URLSearchParams(location.search).get('theme');
  if (q === 'light' || q === 'dark') return q;
  var saved = storageGet('architecture-diagrams-theme');
  if (saved === 'light' || saved === 'dark') return saved;
  if (spec.theme !== 'auto') return spec.theme;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

/* What changed between two specs, in words: tabs, blocks, connections and groups. */
function edDiff(a, b) {
  var out = [], da = (a && a.diagrams) || [], db = (b && b.diagrams) || [];
  var key = function (d, i) { return str(d.id) || ('#' + (i + 1)); };
  var name = function (d, i) { return str(d.title) || key(d, i); };
  var mapA = {};
  da.forEach(function (d, i) { mapA[key(d, i)] = d; });
  var seen = {};
  db.forEach(function (d, i) {
    var k = key(d, i), old = mapA[k];
    seen[k] = true;
    var where = et('hTab') + ' ' + name(d, i) + ': ';
    if (!old) { out.push(['add', where + et('hAdded')]); return; }
    if (JSON.stringify(old) === JSON.stringify(d)) return;
    var before = out.length;
    var list = function (arr) { var m = {}; (arr || []).forEach(function (x) { if (x && x.id !== undefined) m[str(x.id)] = x; }); return m; };
    var label = function (x) { var t0 = stripMarks(str(x.title || x.label || x.name)).split('\n')[0]; return t0 ? t0 + ' (' + x.id + ')' : String(x.id); };
    [['nodes', lang === 'vi' ? 'khối' : 'block'], ['groups', lang === 'vi' ? 'nhóm' : 'group']].forEach(function (kind) {
      var A = list(old[kind[0]]), B = list(d[kind[0]]);
      Object.keys(B).forEach(function (id) {
        if (!A[id]) { out.push(['add', where + kind[1] + ' ' + label(B[id])]); return; }
        if (JSON.stringify(A[id]) === JSON.stringify(B[id])) return;
        var what = [];
        var keys = {};
        Object.keys(A[id]).concat(Object.keys(B[id])).forEach(function (q) { keys[q] = true; });
        Object.keys(keys).forEach(function (q) {
          if (JSON.stringify(A[id][q]) === JSON.stringify(B[id][q]) || q === 'drawio') return;
          what.push(q === 'x' || q === 'y' ? et('hMoved') : q === 'w' || q === 'h' ? et('hResized') : String(ec(q)).toLowerCase());
        });
        what = what.filter(function (q, i2) { return what.indexOf(q) === i2; });
        out.push(['mod', where + kind[1] + ' ' + label(B[id]) + ' (' + what.join(', ') + ')']);
      });
      Object.keys(A).forEach(function (id) { if (!B[id]) out.push(['del', where + kind[1] + ' ' + label(A[id])]); });
    });
    var ek = function (e) { return str(e.from || JSON.stringify(e.fromPoint)) + ' → ' + str(e.to || JSON.stringify(e.toPoint)); };
    var countA = {}, countB = {};
    (old.edges || []).forEach(function (e) { var k2 = ek(e); countA[k2] = (countA[k2] || []).concat([e]); });
    (d.edges || []).forEach(function (e) { var k2 = ek(e); countB[k2] = (countB[k2] || []).concat([e]); });
    var edgeWord = lang === 'vi' ? 'đường nối' : 'connection';
    Object.keys(countB).forEach(function (k2) {
      var A2 = countA[k2] || [], B2 = countB[k2];
      B2.forEach(function (e, j) {
        if (!A2[j]) out.push(['add', where + edgeWord + ' ' + k2 + (e.label ? ' "' + e.label + '"' : '')]);
        else if (JSON.stringify(A2[j]) !== JSON.stringify(e)) out.push(['mod', where + edgeWord + ' ' + k2]);
      });
      A2.slice(B2.length).forEach(function () { out.push(['del', where + edgeWord + ' ' + k2]); });
    });
    Object.keys(countA).forEach(function (k2) { if (!countB[k2]) countA[k2].forEach(function () { out.push(['del', where + edgeWord + ' ' + k2]); }); });
    if (out.length === before) out.push(['mod', where + et('hChanged')]);
  });
  da.forEach(function (d, i) { if (!seen[key(d, i)]) out.push(['del', et('hTab') + ' ' + name(d, i)]); });
  if (str(a.title) !== str(b.title)) out.push(['mod', (lang === 'vi' ? 'Tiêu đề: ' : 'Title: ') + str(b.title)]);
  return out;
}

/* Copies text; falls back to a hidden text box when the clipboard API is not allowed (for example on file:// pages). */

function edInput(value, onInput, opts) {
  opts = opts || {};
  var el;
  if (opts.type === 'area') {
    el = H('textarea', { class: 'ed-in', rows: 1, spellcheck: 'false' });
    el.value = value === undefined || value === null ? '' : value;
    var grow = function () { el.style.height = 'auto'; el.style.height = Math.min(200, el.scrollHeight + 2) + 'px'; };
    el.addEventListener('input', grow);
    setTimeout(grow, 0);
  } else if (opts.type === 'select') {
    el = H('select', { class: 'ed-in' });
    edFillSelect(el, opts.options, value);
  } else if (opts.type === 'check') {
    el = H('input', { type: 'checkbox', class: 'ed-check' });
    el.checked = !!value;
  } else {
    el = H('input', { class: 'ed-in', type: opts.type === 'num' ? 'number' : 'text', step: opts.type === 'num' ? 'any' : null, spellcheck: 'false', list: opts.list || null });
    el.value = value === undefined || value === null ? '' : value;
    if (opts.type === 'combo') el.setAttribute('autocomplete', 'off');
  }
  if (opts.placeholder) el.setAttribute('placeholder', opts.placeholder);
  if (opts.title) el.title = opts.title;
  var evName = opts.type === 'select' || opts.type === 'check' || opts.type === 'combo' || opts.lazy ? 'change' : 'input';
  el.addEventListener(evName, function () {
    var v = opts.type === 'check' ? el.checked : el.value;
    if (opts.type === 'num') v = el.value === '' ? undefined : +el.value;
    onInput(v, el);
  });
  return el;
}
function edFillSelect(el, options, value) {
  el.textContent = '';
  var found = false;
  (options || []).forEach(function (o) {
    if (o && o.group) {
      var og = H('optgroup', { label: o.group });
      o.items.forEach(function (it) { var op = H('option', { value: it[0], text: it[1] }); if (String(it[0]) === String(value)) { op.selected = true; found = true; } og.appendChild(op); });
      el.appendChild(og);
      return;
    }
    var op = H('option', { value: o[0], text: o[1] });
    if (String(o[0]) === String(value === undefined || value === null ? '' : value)) { op.selected = true; found = true; }
    el.appendChild(op);
  });
  if (!found && value !== undefined && value !== null && value !== '') {
    var extra = H('option', { value: value, text: String(value) });
    extra.selected = true;
    el.insertBefore(extra, el.firstChild);
  }
}

/* Panning by dragging empty canvas space and zooming with Ctrl + wheel work in every page. */
function installCanvasGestures() {
  var pan = null;
  document.addEventListener('pointerdown', function (ev) {
    if (!active || !active.canvas || ev.button !== 0 || !active.canvas.contains(ev.target)) return;
    if (ev.shiftKey && ED && active.d.kind === 'graph') return;
    if (ev.target.closest && (ev.target.closest('.ed-inline-edit') || ev.target.closest('.node') || ev.target.closest('.edge') || ev.target.closest('.ed-h') || ev.target.closest('.ed-edgebar'))) return;
    pan = { x: ev.clientX, y: ev.clientY, l: active.canvas.scrollLeft, t: active.canvas.scrollTop, moved: false, canvas: active.canvas };
  });
  window.addEventListener('pointermove', function (ev) {
    if (!pan) return;
    var dx = ev.clientX - pan.x, dy = ev.clientY - pan.y;
    if (!pan.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    pan.moved = true;
    pan.canvas.classList.add('panning');
    pan.canvas.scrollLeft = pan.l - dx;
    pan.canvas.scrollTop = pan.t - dy;
  });
  window.addEventListener('pointerup', function () {
    if (pan && pan.moved) {

      var swallow = function (e) { e.stopPropagation(); e.preventDefault(); window.removeEventListener('click', swallow, true); };
      window.addEventListener('click', swallow, true);

    }
    pan = null;
  });
  document.addEventListener('wheel', function (ev) {
    if (!(ev.ctrlKey || ev.metaKey) || !active || !active.canvas || !active.canvas.contains(ev.target)) return;
    ev.preventDefault();

    var px = ev.clientX - r.left + c.scrollLeft, py = ev.clientY - r.top + c.scrollTop;

}

        g.appendChild(S('rect', { x: fmt(b.x - 4), y: fmt(b.y - 4), width: fmt(b.w + 8), height: fmt(b.h + 8), rx: 7, style: 'fill:var(--accent-soft);stroke:var(--accent)',

        g.appendChild(S('text', { x: fmt(b.x + b.w / 2), y: fmt(glyph ? b.y + b.h + 16 : b.y + b.h / 2 + 4), 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 650,
          style: 'fill:var(--accent)', text: str(asText(n.title)) || str(n.id) }));

  }
  var p = st.L.nodes[id], bar = H('div', { class: 'ed-edgebar ed-ghostbar', role: 'toolbar' });
  var ok = H('button', { type: 'button', class: 'ed-bb ed-ghost-ok', title: at('ghTab') }, [H('kbd', { text: 'Tab' }), H('span', { text: s.label })]);
  ok.addEventListener('click', function (ev) { ev.stopPropagation(); edAcceptGhost(); });
  var more = H('button', { type: 'button', class: 'ed-bb', title: at('ghMore'), 'aria-label': at('ghMore'), text: '⋯' });
  more.addEventListener('click', function (ev) {

  var sc = svgScale(st), off = svgOffset(st), under = ghostBox || { x: p.x - p.w / 2, y: p.y - p.h / 2, w: p.w, h: p.h };

/* Typing in a block's row selects that block (not a selection of several), so its suggestions follow the typing. */

/* ---------- a small picture of each pattern, for the Patterns list ---------- */
function asPatternThumb(pat, w, h) {
  var T = THEMES[themeName], list = [], byId = {};
  pat.nodes.forEach(function (n) {
    var sz = asSize({ shape: n.shape, w: n.w, h: n.h, size: n.size, title: asText(n.title), desc: asText(n.desc) });
    var b = { x: n.x || 0, y: n.y || 0, w: sz.w, h: sz.h, n: n };
    list.push(b);
    byId[n.id] = b;
  });
  var bb = asBounds(list);
  if (!bb) return null;
  var pad = 6, k = Math.min((w - pad * 2) / bb.w, (h - pad * 2) / bb.h, 0.7);
  var ox = (w - bb.w * k) / 2 - bb.x * k, oy = (h - bb.h * k) / 2 - bb.y * k;
  var g = S('g', { transform: 'translate(' + fmt(ox) + ' ' + fmt(oy) + ') scale(' + fmt(k) + ')' });
  var end = function (ref) {
    var s0 = String(ref), i = s0.indexOf('.'), b = byId[i < 0 ? s0 : s0.slice(0, i)];
    if (!b) return null;
    var p = i < 0 ? null : asPinByName(b.n, s0.slice(i + 1));
    return p ? asPinPoint(b, p) : { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  };
  (pat.edges || []).forEach(function (e) {
    var a = end(e.from), b = end(e.to);
    if (!a || !b) return;
    var mx = (a.x + b.x) / 2, mid = e.points ? e.points.map(function (q) { return { x: q[0], y: q[1] }; }) : [{ x: mx, y: a.y }, { x: mx, y: b.y }];
    g.appendChild(S('path', { d: 'M' + [a].concat(mid, [b]).map(function (q) { return fmt(q.x) + ',' + fmt(q.y); }).join('L'),
      fill: 'none', stroke: (T.edges || {})[e.kind] || T.muted, 'stroke-width': fmt(1.3 / k) }));
  });
  list.forEach(function (b) {
    var shape = normShape(b.n.shape);
    if (!CORE_SHAPES[shape] && SYMBOLS[shape] && shape !== 'text') {
      g.appendChild(S('g', { transform: 'translate(' + fmt(b.x) + ' ' + fmt(b.y) + ')' }, symbolElements(shape, b.w, b.h, { fill: T.symFill, stroke: T.ink, text: T.ink, strokeWidth: 1.3 / k, opts: {} })));
    } else if (shape !== 'text') {
      g.appendChild(S('rect', { x: fmt(b.x), y: fmt(b.y), width: fmt(b.w), height: fmt(b.h), rx: fmt(6), fill: PALETTE[b.n.color] || PALETTE.slate }));
    }
  });
  return S('svg', { class: 'ed-pat-thumb', width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, 'aria-hidden': 'true' }, [g]);
}

/* ---------- an answer pasted from an AI chat: a whole spec, or {"ops": [...]} for the open tab ---------- */
function edApplyAnswer(text) {
  var t = String(text || '').trim(), fence = t.match(/```(?:json)?\s*([\s\S]*?)```/), parsed;
  if (fence) t = fence[1];
  try { parsed = JSON.parse(t); } catch (e) { return et('jsonBad') + ' ' + e.message; }
  if (!parsed || typeof parsed !== 'object') return et('jsonBad');
  if (Array.isArray(parsed.ops) && !parsed.diagrams && !parsed.nodes) {
    var d = edDiagram(), res = d ? asApplyOps(ED.raw, ED.diag, parsed.ops, edStateFor(d)) : { errors: [et('jsonBad')] };
    if (res.errors.length) return res.errors.join(' · ');
    edRunOps(parsed.ops, et('lJson'));
    edHoldStatus(asl('opsApplied', parsed.ops.length));
    return null;
  }
  clearTimeout(edUndoTimer);
  edPushUndo();
  ED.raw = edCanonical(parsed);
  ED.diag = Math.min(ED.diag, Math.max(0, ED.raw.diagrams.length - 1));
  ED.selected = null;
  ED.multi = null;
  edChanged(true, et('lJson'));
  return null;
}

/* ---- boot.js ---- */
/* ---------- boot ---------- */
var PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
var installed = false;

function showNotice(title, lines) {
  var box = document.getElementById('notice');
  box.hidden = false;
  box.appendChild(H('strong', { text: title }));
  if (lines && lines.length) {
    var ul = H('ul');
    lines.forEach(function (l) { ul.appendChild(H('li', { text: l })); });
    box.appendChild(ul);
  }
}

function readSpec() {
  var raw = document.getElementById('diagram-spec').textContent;
  if (raw.indexOf('@@SPEC') >= 0) { showNotice(I18N.en.rawTemplate + ' / ' + I18N.vi.rawTemplate); return null; }
  try { return JSON.parse(raw); }
  catch (err) { showNotice(I18N.en.badSpec + ' ' + err.message); return null; }
}

function resetPage() {
  states.forEach(stopPlay);
  states = [];
  active = null;
  problems = [];
  problemList = [];
  document.getElementById('sections').textContent = '';
  var tabs = document.getElementById('tabs');
  tabs.textContent = '';
  tabs.hidden = true;
  var notice = document.getElementById('notice');
  notice.textContent = '';
  notice.hidden = true;
}

function installGlobal() {
  if (installed) return;
  installed = true;
  document.getElementById('theme-btn').addEventListener('click', function () { setTheme(themeName === 'dark' ? 'light' : 'dark', true); });
  document.addEventListener('keydown', function (ev) {
    if (!active || /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target && ev.target.tagName) || '')) return;
    if (ev.key === '/' && active.searchEl) { ev.preventDefault(); active.searchEl.focus(); return; }
    if (!ev.ctrlKey && !ev.metaKey && !ev.altKey && active.svg) {
      if (ev.key === '+' || ev.key === '=') { ev.preventDefault(); zoomBy(active, 1.25); return; }
      if (ev.key === '-' || ev.key === '_') { ev.preventDefault(); zoomBy(active, 0.8); return; }
      if (ev.key === '0') { ev.preventDefault(); active.scale = null; active.userFit = true; applyZoom(active); return; }
    }
    var hasSteps = active.d.kind === 'graph' && active.d.steps.length;
    if (ev.key === 'ArrowRight' && hasSteps) { ev.preventDefault(); stopPlay(active); setStep(active, active.stepIndex + 1); }
    else if (ev.key === 'ArrowLeft' && hasSteps) { ev.preventDefault(); stopPlay(active); setStep(active, active.stepIndex < 0 ? 0 : active.stepIndex - 1); }
    else if (ev.key === 'Escape' && active.d.kind === 'graph') {
      stopPlay(active); resetSteps(active); active.focus = null; applyFocus(active); hideDetails(active);
      if (active.searchEl && active.searchEl.value) { active.searchEl.value = ''; runSearch(active, ''); }
    }
  });
  var resizeTimer = null;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { states.forEach(alignGrid); }, 120); });
  var printTheme = null;
  window.addEventListener('beforeprint', function () { if (themeName === 'dark') { printTheme = 'dark'; setTheme('light', false); } });
  window.addEventListener('afterprint', function () { if (printTheme) { setTheme(printTheme, false); printTheme = null; } });
}

function renderSpec(raw, keepTheme) {
  resetPage();
  spec = normalizeSpec(raw);
  lang = spec.lang;
  document.documentElement.lang = lang;
  document.getElementById('doc-title').textContent = spec.title || (spec.diagrams[0] && spec.diagrams[0].title) || '';
  if (spec.title) document.title = spec.title;
  var sub = document.getElementById('doc-subtitle');
  sub.hidden = !spec.subtitle;
  sub.textContent = spec.subtitle;
  document.getElementById('foot').textContent = t('made');
  var hasDagre = typeof window.dagre !== 'undefined', dagreMissing = false;
  spec.diagrams.forEach(function (d, i) {
    var st = { d: d, uid: 'ad' + i, scale: null, focus: null, stepIndex: -1, timer: null, adj: {} };
    if (d.kind === 'graph') {
      if (!hasDagre) { dagreMissing = true; return; }
      if (!d.nodes.length) { problem('[' + (d.title || d.id) + '] ', 'noNodes'); return; }
      d.nodes.forEach(function (n) { st.adj[n.id] = []; });
      d.edges.forEach(function (e, k) {
        if (st.adj[e.from]) st.adj[e.from].push(k);
        if (e.to !== e.from && st.adj[e.to]) st.adj[e.to].push(k);
      });
      st.L = layoutDiagram(d);
      /* room to grow while editing a hand-placed drawing (see outW in renderer.js) */
      if (d.layout === 'manual' && document.body.classList.contains('editing')) { st.L.roomX = 240; st.L.roomY = 140; st.L.width += 240; st.L.height += 140; }
    } else if (d.kind === 'wave') {
      if (!d.rows.length) return;
      st.L = layoutWave(d);
    } else if (d.kind === 'register') {
      if (!d.registers.length) return;
      st.L = layoutRegisters(d);
    } else if (d.kind === 'memory') {
      if (!d.items.length) return;
      st.L = layoutMemory(d);
    } else if (d.kind === 'chip') {
      if (!Object.keys(d.blockById).length) return;
      st.L = layoutChip(d);
    } else {
      if (!d.pins.length) return;
      st.L = layoutPinout(d);
    }
    states.push(st);
  });
  if (dagreMissing) showNotice(t('noDagre'));
  states.forEach(buildSection);
  buildTabs();
  setTheme(keepTheme ? themeName : initialTheme(), false);
  var hash = decodeURIComponent(location.hash.replace('#', ''));
  var start = 0;
  states.forEach(function (st, i) { if (st.d.id === hash) start = i; });
  if (states.length) showSection(start, false);
  /* while editing, the Checks list above the form shows these */
  if (problems.length && !document.body.classList.contains('editing')) showNotice(t('skipped'), problems);
}

var currentRaw = null;

/* A spec can carry a whole draw.io file ({"drawio": "<mxfile…>"}); it is converted before drawing. */
function prepareSpec(raw) {
  if (raw && typeof raw.drawio === 'string') {
    return loadStencilPack().then(function () { return parseDrawio(raw.drawio, raw.name || raw.title || ''); }).then(function (spec) {
      if (raw.title) spec.title = raw.title;
      spec.lang = raw.lang || spec.lang;
      return spec;
    });
  }
  return specUsesStencils(raw) ? loadStencilPack().then(function () { return raw; }) : Promise.resolve(raw);
}
function drawioNotice(spec) {
  if (spec && spec.drawioSkipped) showNotice((lang === 'vi' ? spec.drawioSkipped + ' trang nén trong file chưa mở được. ' : spec.drawioSkipped + ' compressed page(s) of this file could not be opened. ') + t('oldBrowser'));
  if (!spec || !spec.drawioNote) return;
  showNotice(lang === 'vi'
    ? spec.drawioNote + ' hình trong file dùng thư viện hình chưa có trong tool nên được vẽ thành khung chữ nhật. Khi lưu lại thành file draw.io, các hình này vẫn giữ nguyên dạng gốc.'
    : spec.drawioNote + ' shapes in this file come from a draw.io library this tool does not draw, so they are shown as plain boxes. Saving back to draw.io keeps their original look.');
}

function runCliExport(format, id) {
  var st = states.filter(function (x) { return x.d.id === id; })[0] || states[0];
  var done = function (payload) { document.documentElement.setAttribute('data-export', payload); };
  var fail = function (err) { done('error:' + encodeURIComponent(err && err.message ? err.message : String(err))); };
  try {
    if (format === 'spec') done(encodeURIComponent(JSON.stringify(currentRaw, null, 1)));
    else if (format === 'library') drawioLibrary().then(function (xml) { done(encodeURIComponent(xml)); }, fail);
    else if (!st) done('error:' + encodeURIComponent('nothing to export'));
    else if (format === 'drawio') prepareDrawioExport().then(function () { done(encodeURIComponent(drawioDocument())); }, fail);
    else if (format === 'mermaid') done(encodeURIComponent(id ? mermaidText(st) : mermaidDocument()));
    else if (format === 'svg') done(encodeURIComponent(exportXml(st)));
    else if (format === 'csv') done(encodeURIComponent(csvText(st)));
    else if (format === 'png') pngDataUrl(st, function (url) { done(url || 'error:png'); });
    else done('error:' + encodeURIComponent('unknown format ' + format));
  } catch (err) { done('error:' + encodeURIComponent(err.message)); }
}

function boot() {
  if (booted) return;
  booted = true;
  var raw = readSpec();
  if (!raw) return;
  var params = new URLSearchParams(location.search);
  if (params.get('shot') === '1') document.documentElement.classList.add('shot');
  installGlobal();
  installEditor();
  prepareSpec(raw).then(function (ready) {
    var wantsEditor = ready.editor === true || ready.playground === true || params.get('edit') === '1';
    var start = (ready.editor || ready.playground) && ready.example && typeof ready.example === 'object' ? ready.example : ready;
    if ((ready.editor || ready.playground) && !ready.example) start = { title: '', lang: ready.lang || 'vi', diagrams: [] };
    currentRaw = start;
    if (!start.lang && ready.lang) start.lang = ready.lang;
    renderSpec(start, false);
    editorButton();
    drawioNotice(ready);
    /* draw.io shapes and compressed draw.io pages are unpacked with DecompressionStream */
    if (typeof DecompressionStream === 'undefined' && !ready.drawioSkipped && (typeof raw.drawio === 'string' || specUsesStencils(raw))) showNotice(t('oldBrowser'));
    if (wantsEditor) openEditor(start);
    var pageBox = document.querySelector('.page').getBoundingClientRect();
    document.documentElement.setAttribute('data-shot-height', String(Math.ceil(pageBox.bottom + window.scrollY)));
    if (params.get('export')) runCliExport(params.get('export'), params.get('diagram'));
    if (params.get('assist') === '1') runCliAssist();
  }).catch(function (err) {
    showNotice(t('badSpec') + ' ' + (err && err.message ? err.message : err));
    if (params.get('export') || params.get('assist')) document.documentElement.setAttribute('data-export', 'error:' + encodeURIComponent(String(err && err.message || err)));
  });
}

window.__adBoot = function () {
  if (window.dagre || window.__adDagre) boot();
};
if (window.dagre || window.__adDagre) window.__adBoot();
setTimeout(function () { if (!booted) boot(); }, 15000);

})();
